<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Week 3 - Semantics and Lists</title>
</head>
<body>
    <header>
        <h1>HTML Week 3 - Semantics and Lists</h1>
        <h3>Plus an intro to CSS</h3>
    </header>
    <main>
<!--article is a self contained block of text-->
<article>
    <!-- an article needs a head tag(h1-h6)-->
     <h2>An article is a self contained block of text</h2>
     <p>This is the text of the article</p>
     <blockquote>
        <p> a blockquote has different styling from regular text</p>
     </blockquote>
</article>
<!--an aside is for separate content that is not necessary to understand the page  -->
<aside>
    <h3>Asides should also have a heading</h3>
</aside>
    </main>
    <footer>
        <p>scary stuff &copy; scary people</p>
    </footer>
</body>
</html>
